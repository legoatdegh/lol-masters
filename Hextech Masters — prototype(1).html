<html lang="fr"><head><meta charset="utf-8"><title>Hextech Masters — prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe4;--fg:#1a2233;--mut:#6b7385;--pan:#fffaf0;--ln:#d9cfb4;--gold:#8a6d2b;--teal:#0a8f86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--fg:#e9e2cf;--mut:#8d98ad;--pan:#101d38;--ln:#2a3a5c;--gold:#c8aa6e;--teal:#0ac8b9}}
:root[data-theme="dark"]{--bg:#0a1428;--fg:#e9e2cf;--mut:#8d98ad;--pan:#101d38;--ln:#2a3a5c;--gold:#c8aa6e;--teal:#0ac8b9}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 Barlow,system-ui,sans-serif;min-height:100%}
h1,h2{font-family:Cinzel,Georgia,serif;margin:0}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ln)}
h1{font-size:24px;color:var(--gold);letter-spacing:.04em}
.ess{color:var(--teal);font-weight:600}
nav{display:flex;gap:8px;padding:12px 20px}
nav button,.btn{font:600 15px Barlow,sans-serif;border:1px solid var(--gold);background:transparent;color:var(--gold);padding:9px 16px;cursor:pointer;border-radius:4px}
nav button.on,.btn.p{background:var(--gold);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
main{padding:8px 20px 40px;max-width:1000px;margin:auto}
.chests{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:8px}
.box{background:var(--pan);border:1px solid var(--ln);padding:22px;text-align:center}
.box h2{font-size:20px;margin-bottom:6px}.box p{color:var(--mut);margin:4px 0 14px}
.chest{font-size:64px;line-height:1;margin:6px 0}
.special{border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:12px}
.card{position:relative;background:var(--pan);border:2px solid var(--c);box-shadow:0 0 14px -4px var(--c);display:flex;flex-direction:column;animation:in .5s both;animation-delay:var(--d,0s)}
@keyframes in{from{transform:rotateY(90deg) scale(.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.art{height:96px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,hsl(var(--h) 55% 28%),hsl(calc(var(--h) + 50) 60% 45%))}
.tag{position:absolute;top:6px;left:6px;background:var(--c);color:#111;font-weight:800;font-size:12px;padding:1px 7px;border-radius:3px}
.n{position:absolute;top:6px;right:6px;background:#000a;color:#fff;font-size:12px;padding:1px 7px;border-radius:3px}
.info{padding:8px 10px;flex:1}.info b{display:block;font-size:15px;line-height:1.2}.info span{color:var(--mut);font-size:12px}
.st{display:flex;justify-content:space-between;border-top:1px solid var(--ln);padding:6px 10px;font-size:13px;font-weight:600}
.st i{font-style:normal;color:#e0524b}.st u{text-decoration:none;color:#4a8df0}
.dis{border:0;border-top:1px solid var(--ln);background:none;color:var(--mut);font:13px Barlow,sans-serif;padding:7px;cursor:pointer}
.dis:hover{color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font:600 13px Barlow,sans-serif;border:1px solid var(--c,var(--ln));background:none;color:var(--fg);padding:4px 11px;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--c,var(--gold));color:#111}
.ov{position:fixed;inset:0;background:#000d;display:none;overflow:auto;padding:30px 16px;z-index:9}.ov.on{display:block}
.ov .in{max-width:900px;margin:auto;text-align:center}.ov h2{color:var(--gold);margin-bottom:6px}
.ov .grid{grid-template-columns:repeat(auto-fit,minmax(140px,170px));justify-content:center;margin:20px 0}
.mut{color:var(--mut)}
</style></head><body>

const hash=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const POOL=RAW.split('\n').map((l,i)=>{const[t,n,s,r]=l.split('|'),h=hash(n),[a,b]=RG[r];return{id:i,t,n,s,r,h:h%360,atk:a+h%(b-a),def:a+(h>>4)%(b-a)}});
let S={inv:{},chests:3,ess:0,t:Date.now(),k:0};
try{const x=localStorage.getItem('hm1');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('hm1',JSON.stringify(S))}catch(e){}};
const CAP=5,EVERY=30*60e3,DAY=864e5;let tab=1,filt='all';
const $=id=>document.getElementById(id);
function pick(r){const p=POOL.filter(c=>c.r===r);return p[Math.random()*p.length|0]}
function roll(){let x=Math.random()*100,i=0;for(;i<4;i++){if(x<W[i])break;x-=W[i]}return pick(R[i])}
function card(c,o={}){return`<div class="card" style="--c:${COL[c.r]};--h:${c.h};--d:${o.d||0}s"><span class="tag" title="${RN[c.r]}">${c.r}</span>${o.n>1?`<span class="n">×${o.n}</span>`:''}<div class="art">${IC[c.t]}</div><div class="info"><b>${c.n}</b><span>${c.t} · ${c.s}</span></div><div class="st"><i>⚔ ${c.atk}</i><u>🛡 ${c.def}</u></div>${o.dis?`<button class="dis" data-d="${c.id}">Défausser (+1 essence)</button>`:''}</div>`}
function open(special){
  if(special){if(Date.now()-S.k<DAY)return;S.k=Date.now()}else{if(S.chests<1)return;if(S.chests===CAP)S.t=Date.now();S.chests--}
  const got=[];for(let i=0;i<(special?4:5);i++)got.push(roll());
  if(special)got.push(pick(Math.random()<.85?'UR':'L'));
  got.forEach(c=>S.inv[c.id]=(S.inv[c.id]||0)+1);save();
  $('ovt').textContent=special?'Coffre spécial ouvert':'Coffre ouvert';
  $('ovg').innerHTML=got.map((c,i)=>card(c,{d:i*.25})).join('');
  $('ov').classList.add('on');$('ovb').focus();render();
}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1e3)),h=s/3600|0,m=(s%3600)/60|0;return(h?h+' h ':'')+m+' min '+String(s%60).padStart(2,'0')+' s'}
function render(){
  $('ess').textContent=S.ess;$('t1').className=tab===1?'on':'';$('t2').className=tab===2?'on':'';
  if(tab===1){
    const nk=S.k+DAY-Date.now(),ok=nk<=0,nc=S.t+EVERY-Date.now();
    $('m').innerHTML=`<div class="chests"><div class="box"><div class="chest">📦</div><h2>Coffre hextech</h2><p>5 cartes. Stock : <b>${S.chests}</b> / ${CAP}${S.chests<CAP?` · prochain dans <span id="cd">${fmt(nc)}</span>`:''}</p><button class="btn p" id="o1" ${S.chests?'':'disabled'}>Ouvrir un coffre</button></div>
    <div class="box special"><div class="chest">🗝️</div><h2>Coffre spécial</h2><p>Une clé hextech par jour. 4 cartes + 1 UR garantie.</p><button class="btn p" id="o2" ${ok?'':'disabled'}>${ok?'Utiliser la clé':'Clé dans '+fmt(nk)}</button></div></div>
    <p class="mut">Test : <button class="btn" id="o3">+1 coffre</button> <button class="btn" id="o4">Clé prête</button> <button class="btn" id="o5">Tout effacer</button></p>`;
    $('o1').onclick=()=>open(0);$('o2').onclick=()=>open(1);
    $('o3').onclick=()=>{S.chests=Math.min(CAP,S.chests+1);save();render()};$('o4').onclick=()=>{S.k=0;save();render()};
    $('o5').onclick=()=>{S={inv:{},chests:3,ess:0,t:Date.now(),k:0};save();render()};
  }else{
    const own=POOL.filter(c=>S.inv[c.id]),tot=own.length,sh=own.filter(c=>filt==='all'||c.r===filt);
    $('m').innerHTML=`<h2>Collection · ${tot} / ${POOL.length} cartes</h2><div class="chips"><button data-f="all" class="${filt==='all'?'on':''}">Toutes</button>${R.map(r=>`<button data-f="${r}" style="--c:${COL[r]}" class="${filt===r?'on':''}">${RN[r]}</button>`).join('')}</div>
    <div class="grid">${sh.length?sh.sort((a,b)=>R.indexOf(b.r)-R.indexOf(a.r)).map(c=>card(c,{n:S.inv[c.id],dis:1})).join(''):'<p class="mut">Rien ici. Ouvre un coffre pour commencer ta collection.</p>'}</div>`;
    $('m').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filt=b.dataset.f;render()});
    $('m').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;if(--S.inv[i]<1)delete S.inv[i];S.ess++;save();render()});
  }
}
$('t1').onclick=()=>{tab=1;render()};$('t2').onclick=()=>{tab=2;render()};$('ovb').onclick=()=>$('ov').classList.remove('on');
setInterval(()=>{if(S.chests<CAP&&Date.now()-S.t>=EVERY){S.chests++;S.t+=EVERY;if(S.chests>=CAP)S.t=Date.now();save();if(tab===1&&!$('ov').classList.contains('on'))render()}
  if(tab===1&&!$('ov').classList.contains('on')){const cd=$('cd');if(cd)cd.textContent=fmt(S.t+EVERY-Date.now());const o=$('o2');if(o&&o.disabled)o.textContent='Clé dans '+fmt(S.k+DAY-Date.now())}},1000);
render();
</script></body></html>
